<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Test Site</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
        <link rel="stylesheet" href="./CSS/communityRegister.css"/>
        <link rel="stylesheet" href="./CSS/bootstrap.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark ">
                <a class="navbar-brand" href="#"></a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                  <div class="navbar-nav">
                    <a class="nav-item nav-link" href="/">Home</span></a>
                    <a class="nav-item nav-link" href="/game">Game</a>
                    <a class="nav-item nav-link active" href="/communityRegister">Community</a>
                  </div>
                </div>
              </nav>
            
        </header>
        <main>
            <div class="container">
                <form class="row g-3" action="/users/SignUp" method="post">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">FirstName</label>
                        <input name="firstName" type="text" class="form-control" id="firstName">
                      </div>
                      <div class="col-md-6">
                        <label for="lastName" class="form-label">LastName</label>
                        <input name="lastName" type="text" class="form-control" id="lastName">
                      </div>
                    <!-- <div class="col-12">
                      <label for="userName" class="form-label">UserName</label>
                      <input name="userName" type="text" class="form-control" id="userName">
                    </div> -->
                    <div class="col-12">
                        <label for="inputEmail" class="form-label">Email</label>
                        <input name="email" type="email" class="form-control" id="inputEmail">
                      </div>
                    <div class="col-12">
                      <label for="inputPassword4" class="form-label">Password</label>
                      <input name="password" type="password" class="form-control" id="inputPassword4">
                    </div>
                    <div class="col-12">
                      <label for="inputAddress" class="form-label">Address</label>
                      <input name="address" type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
                    </div>
                    <div class="col-12">
                      <label for="inputAddress2" class="form-label">Address 2</label>
                      <input name="address2" type="text" class="form-control" id="inputAddress2" placeholder="Apartment,block or floor">
                    </div>
                    <div class="col-md-6">
                      <label for="inputCity" class="form-label">City</label>
                      <input name="city" type="text" class="form-control" id="inputCity">
                    </div>
                    <div class="col-md-4">
                      <label for="inputState" class="form-label">State</label>
                      <select name="state" id="inputState" class="form-select">
                        <option selected disabled>Choose...</option>
                        <option>Andhra Pradesh</option>
                        <option>Telangana</option>
                      </select>
                    </div>
                    <div  class="col-md-2">
                      <label for="inputZip" class="form-label">Zip</label>
                      <input name="zip" type="text" class="form-control" id="inputZip">
                    </div>
                    <div class="col-12">
                      <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                  </form>
            </div>
  </main>
        <footer></footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
    </body>
</html>
